[pytest]
# Eval-suite pytest config — intentionally separate from ``tests/`` so
# the per-test autouse fixtures in ``tests/conftest.py`` don't bleed in
# and reset our session-level prompt cache between every eval call.
#
# Run from ``backend/`` with: ``pytest evals/ -c evals/pytest.ini``
asyncio_mode = auto
testpaths = evals
python_files = test_*.py
python_functions = test_*
markers =
    eval: agent evaluation tests (slow vs unit tests; opt-in via ``-m eval``).
    llm_judge: subset of ``eval`` that requires a real LLM API key — Gemini.
